[package]
name = "lessagent"
version = "0.1.0"
edition = "2024"
description = "A small, persistent local computer agent with a browser UI and MCP tools"
license = "MIT"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
ignore = "0.4"
imagesize = "0.14"
portable-pty = "0.9"
vt100 = "0.16.2"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "io-std", "sync", "time", "signal"] }
tiktoken-rs = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
